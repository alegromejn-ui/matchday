<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080c18">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Матчдей — прогнози</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c18;--panel:#101831;--ink:#f3efe6;--mute:#8a93ad;--line:#222c4a;--gold:#e3c07a;--h:#3fc28a;--d:#6d7794;--a:#ff7a52;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.disp{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:340px;background:radial-gradient(ellipse 70% 100% at 50% 0,rgba(227,192,122,.16),transparent 70%);pointer-events:none}
main{position:relative;max-width:560px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-end;padding:14px 2px 6px}
header p{margin:0 0 6px;color:var(--gold);font-weight:800;font-size:13px}
h1{margin:0;font-weight:900;font-size:54px;line-height:.92}
button{font:inherit;color:inherit;cursor:pointer}
.btn{font-weight:700;font-size:13px;padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);background:none}
.gold{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:800}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;color:var(--mute);font-size:12px;line-height:1.45;margin:8px 2px}
.bar span{min-width:0}.bar b{color:var(--ink)}.err{color:var(--a)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;margin:0 -16px;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0);z-index:5;background:linear-gradient(var(--bg) 75%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-weight:700;font-size:14px;padding:9px 15px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--mute)}
.tab[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day{margin:22px 2px 10px;font-weight:800;font-size:15px;display:flex;align-items:baseline;gap:10px}
.day span{color:var(--mute);font-weight:500;font-size:13px}
.m{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:16px;padding:12px 14px 14px;margin-bottom:10px}
.m:active{transform:scale(.985)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);font-weight:700;margin-bottom:10px}.top i{font-style:normal;color:var(--c)}
.tt{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.t{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;line-height:1.15;min-width:0}.t.r{flex-direction:row-reverse;text-align:right}
.bd{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;border:1.5px solid rgba(255,255,255,.35)}
.sc{font-weight:900;font-size:30px;line-height:1;color:var(--gold);white-space:nowrap}
.rb{display:flex;height:6px;border-radius:9px;overflow:hidden;gap:2px;margin:12px 0 8px}.rb b{display:block}
.h{background:var(--h)}.d{background:var(--d)}.a{background:var(--a)}
.pk{font-size:13px;color:var(--mute)}.pk b{color:var(--ink)}
.empty{color:var(--mute);text-align:center;padding:36px 8px;line-height:1.5}
#sh{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;transform:translateY(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);visibility:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#sh.on{transform:none;visibility:visible}
.in{max-width:560px;margin:0 auto;padding:16px 16px 40px;position:relative}
.meta{margin:18px 0 4px;color:var(--mute);font-size:13px;font-weight:700}.meta i{font-style:normal;color:var(--c)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.vs .t{flex-direction:column;text-align:center;gap:8px;font-size:15px}.vs .bd{width:54px;height:54px;font-size:14px}
.board{display:flex;justify-content:center;align-items:center;gap:10px;margin:6px 0 4px}
.dg{width:78px;height:104px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:94px;line-height:1;color:var(--gold);position:relative;overflow:hidden}
.dg::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--bg)}
.dg span{animation:roll .7s cubic-bezier(.2,.9,.2,1)}@keyframes roll{from{transform:translateY(-70%);opacity:0}}
.col{font-weight:900;font-size:50px;color:var(--mute)}
.verdict{text-align:center;margin:12px 0 4px;font-weight:900;font-size:30px;line-height:1.05}
.conf{text-align:center;color:var(--mute);font-size:13px;margin-bottom:18px}
.big{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px}.big div{display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;min-width:0}
.lab{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin:6px 2px 18px;gap:8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile,.box{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.tile{padding:12px 6px;text-align:center}.tile b{display:block;font-weight:900;font-size:30px;line-height:1}.tile span{font-size:12px;color:var(--mute)}
h3{font-size:14px;margin:22px 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--mute)}.chip b{font-weight:900;font-size:20px;color:var(--ink);margin-right:6px}
.box{padding:14px;display:grid;gap:12px;font-size:13px;color:var(--mute);line-height:1.5}.box b{color:var(--ink)}
.row{display:grid;grid-template-columns:1.3fr .6fr 1.6fr;gap:6px}
label{display:grid;gap:6px;font-size:13px;color:var(--mute)}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:15px;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--gold)}
.ck{display:flex;gap:8px;align-items:center;color:var(--ink)}
a{color:var(--gold)}.note{margin-top:18px;color:var(--mute);font-size:12px;line-height:1.5}
@media (prefers-reduced-motion:reduce){#sh{transition:none}.dg span{animation:none}}
.m{cursor:pointer}
.ctl{display:flex;gap:8px;align-items:center;margin:2px 0 4px}
input[type=search]{flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
.seg button{border:0;background:none;color:var(--mute);font-weight:700;font-size:12px;padding:10px 11px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.st{background:none;border:0;font-size:20px;line-height:1;color:var(--line);padding:0 0 0 8px;vertical-align:middle}
.st[aria-pressed=true]{color:var(--gold)}
.bd{position:relative}.bd.lg{background:#fff!important;color:transparent}
.bd img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:contain}
.lgi{width:18px;height:18px;object-fit:contain;background:#fff;border-radius:50%;padding:2px;vertical-align:middle;margin-right:6px}
.big div{transform-origin:left;animation:gr .8s cubic-bezier(.2,.9,.2,1)}@keyframes gr{from{transform:scaleX(0)}}
.hmx{display:grid;grid-template-columns:auto repeat(6,1fr);gap:3px;font-size:11px;color:var(--mute);text-align:center;align-items:center}
.hc{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:rgba(227,192,122,var(--o));padding:0}
.hc.pk2{outline:2px solid var(--gold)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.roll{display:inline-block;animation:roll .6s cubic-bezier(.2,.9,.2,1);font-size:26px;color:var(--gold)}
</style>
</head>
<body>
<main>
<header><div><p>Прогнози на найближчі дні</p><h1 class="disp">МАТЧДЕЙ</h1></div><button class="btn" id="gear">Ключі API</button></header>
<div class="bar"><span id="bar">Завантаження…</span><button class="btn" id="rf">Оновити</button></div>
<div class="ctl"><input type="search" id="q" placeholder="Пошук команди" aria-label="Пошук команди"><div class="seg" id="so" role="group" aria-label="Сортування"><button data-s="t" aria-pressed="true">Час</button><button data-s="c" aria-pressed="false">Впевн.</button><button data-s="g" aria-pressed="false">Голи</button></div></div>
<div class="tabs" id="tabs" role="group" aria-label="Турніри"></div>
<div id="list"></div>
<p class="note">Прогноз поєднує ринкові коефіцієнти, статистику команд (ESPN) і дані API-Football. Це аналітика, а не гарантія результату.</p>
</main>
<div id="sh" role="dialog" aria-modal="true"><div class="in" id="det"></div></div>
<script src="app.js"></script>
</body>
</html>
